<!doctype html><html><head><meta charset="utf-8"><title>Manual typing baseline</title><link rel="icon" type="image/svg+xml" href="./favicon.svg"></head><body><h1>Manual typing baseline</h1><p>Use this page to record real typing times for the transit comparison; it stores no fabricated results.</p><textarea id="text" rows="5" cols="60" placeholder="Type the passenger message"></textarea><p id="result">Ready</p><script>let started;const box=document.querySelector('#text'),out=document.querySelector('#result');box.addEventListener('focus',()=>started??=performance.now());box.addEventListener('input',()=>{if(started)out.textContent=`Elapsed: ${(performance.now()-started).toFixed(0)} ms`;});</script></body></html>
