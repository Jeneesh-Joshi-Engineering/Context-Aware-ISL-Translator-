<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ISL Bridge — Official</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script></head>
<body class="min-h-screen bg-gradient-to-b from-blue-50/50 via-white to-blue-50/30 font-sans text-gray-900"><main class="mx-auto min-h-screen max-w-4xl p-5 md:p-8"><section id="joinScreen" class="mx-auto flex min-h-[80vh] max-w-xl flex-col justify-center"><div class="rounded-3xl bg-white p-8 text-center shadow-xl shadow-blue-100/60 md:p-10"><p class="text-sm font-semibold uppercase tracking-[.2em] text-blue-600">ISL Bridge · Official device</p><h1 class="mt-3 text-4xl font-bold">Join a translation session</h1><p class="mt-4 text-gray-600">Scan the signer’s QR code or enter the six-character session code.</p><div id="qr-reader" class="mx-auto mt-6 max-w-xs overflow-hidden rounded-2xl"></div><p class="my-4 text-sm text-gray-400">or enter a code manually</p><div class="flex gap-2"><input id="sessionInput" maxlength="6" placeholder="AB3F7K" class="min-w-0 flex-1 rounded-xl border border-gray-300 px-4 py-3 font-mono text-lg uppercase outline-none focus:border-blue-600"><button id="joinButton" class="rounded-xl bg-gray-900 px-5 py-3 font-semibold text-white hover:bg-black">Join</button></div><p id="joinError" class="mt-4 text-sm text-red-600" hidden></p></div></section>
<section id="officialView" class="hidden min-h-[calc(100vh-4rem)] flex-col"><header class="mb-4"><p class="text-sm font-semibold uppercase tracking-[.2em] text-blue-600">ISL Bridge · Official</p><h1 class="text-2xl font-bold">Live conversation</h1></header><div id="reconnecting" class="mb-3 hidden rounded-xl bg-amber-50 px-4 py-2 text-sm text-amber-800">Reconnecting…</div><div id="statusStrip" class="mb-4 rounded-xl border border-blue-100 bg-white px-4 py-3 text-sm font-medium text-gray-600">Session: — · Waiting for signer…</div><section class="flex flex-1 flex-col rounded-3xl bg-white p-4 shadow-lg shadow-blue-100/50"><div id="chatLog" class="min-h-[45vh] flex-1 space-y-3 overflow-y-auto pr-1" aria-live="polite"></div><div class="mt-4 border-t border-gray-100 pt-5 text-center"><button id="micButton" class="h-20 w-20 rounded-full bg-gray-900 text-lg text-white shadow-lg transition hover:bg-black" aria-label="Start voice response">🎙</button><p id="micState" class="mt-2 text-sm text-gray-500">Tap to speak</p><div class="mx-auto mt-4 flex max-w-xl gap-2"><input id="textInput" placeholder="Type a response instead" class="min-w-0 flex-1 rounded-xl border border-gray-300 px-4 py-3 outline-none focus:border-blue-600"><button id="sendText" class="rounded-xl bg-blue-600 px-5 py-3 font-semibold text-white hover:bg-blue-700">Send</button></div><button id="leaveButton" class="mt-4 text-sm text-gray-400 hover:text-gray-700">Leave session</button></div></section></section>
</main><script type="module" src="./js/official.js"></script></body></html>
